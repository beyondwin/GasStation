name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Robolectric API 36 requires Java 21+, while production bytecode remains JVM 17.
  CI_JAVA_TOOLCHAIN_VERSION: "17.0.20+8"
  CI_JAVA_VERSION: "21.0.12.1+1"

permissions:
  contents: read

jobs:
  agent-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Agent contract tests
        env:
          GASSTATION_CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GASSTATION_BUILD_INPUT_EVIDENCE: ""
        run: |
          scripts/agent/test.sh
          scripts/agent/check-contracts.sh --ci

  build-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Verify reviewed build inputs
        run: python3 scripts/quality/verify_build_inputs.py verify --policy config/quality/build-inputs.json
      - name: Run closed strict dependency matrices
        run: |
          python3 scripts/quality/verify_build_inputs.py strict-matrix \
            --policy config/quality/build-inputs.json --group complete
          python3 scripts/quality/verify_build_inputs.py strict-matrix \
            --policy config/quality/build-inputs.json --group product-regressions
          python3 scripts/quality/verify_build_inputs.py configuration-cache \
            --policy config/quality/build-inputs.json
      - name: Reproduce unsigned prod release
        run: |
          python3 scripts/quality/verify_build_inputs.py reproduce \
            --policy config/quality/build-inputs.json \
            --source-commit "$GITHUB_SHA" \
            --output build/reports/build-inputs/reproducible-build.json
      - name: Capture build-input receipt
        run: |
          python3 scripts/quality/verify_build_inputs.py capture \
            --policy config/quality/build-inputs.json \
            --source-commit "$GITHUB_SHA" \
            --evidence build/reports/build-inputs/reproducible-build.json \
            --output build/reports/build-inputs/build-input-receipt.json
      - name: Upload build-input evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-input-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: build/reports/build-inputs/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload source-bound reproducibility receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducible-prod-release-receipt-${{ github.sha }}
          path: build/reports/build-inputs/reproducible-prod-release-receipt.json
          if-no-files-found: error
          retention-days: 7

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Spotless + Lint + Contract Guards
        run: |
          scripts/quality/build_inputs/run_gradle.sh \
            spotlessCheck \
            :app:lintDemoDebug \
            :app:lintProdDebug \
            lint \
            :core:model:checkKotlinAbi \
            :core:observability:checkKotlinAbi \
            :domain:location:checkKotlinAbi \
            :domain:settings:checkKotlinAbi \
            :domain:station:checkKotlinAbi \
            verifyPublicApiBoundaries \
            verifyModuleBoundaries \
            productionDependencyInventory \
            verifyNoDeprecatedComposeTestApis \
            verifyCiRobolectricRuntime \
            -Pgasstation.lintTestSources=false \
            --warning-mode fail \
            --continue
      - name: Convention plugin tests
        run: scripts/quality/build_inputs/run_gradle.sh :build-logic:convention:test --warning-mode fail
      - name: Upload production lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-production-reports
          path: "**/build/reports/lint-results-*"
          if-no-files-found: error
          retention-days: 7
      - name: Upload dependency and public API reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-public-api-reports
          path: |
            build/reports/quality/module-boundaries.json
            build/reports/quality/production-dependency-graph.json
            build/reports/quality/public-api-boundaries.json
          if-no-files-found: error
          retention-days: 7

  lint-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Lint test sources
        run: |
          scripts/quality/build_inputs/run_gradle.sh \
            :app:lintDemoDebug \
            :app:lintProdDebug \
            lint \
            -Pgasstation.lintTestSources=true \
            --warning-mode fail \
            --continue
      - name: Upload test-source lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-test-source-reports
          path: "**/build/reports/lint-results-*"
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Unit Tests
        # Regular unit-test tasks exclude Roborazzi screenshot classes; screenshot-tests owns screenshot regression.
        run: |
          scripts/quality/build_inputs/run_gradle.sh \
            :domain:location:test \
            :core:model:test \
            :domain:station:test \
            :domain:settings:test \
            :core:database:testDebugUnitTest \
            :core:database:compileDebugAndroidTestKotlin \
            :core:datastore:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :core:location:testDebugUnitTest \
            :core:network:test \
            :core:observability:test \
            :data:settings:testDebugUnitTest \
            :data:station:testDebugUnitTest \
            :feature:settings:testDebugUnitTest \
            :feature:station-list:testDebugUnitTest \
            :feature:watchlist:testDebugUnitTest \
            :app:testDemoDebugUnitTest \
            :app:testProdDebugUnitTest \
            :app:compileDemoDebugAndroidTestKotlin \
            :tools:demo-seed:test \
            --warning-mode fail

      - name: Verify Room schema history
        run: scripts/agent/verify-room-schemas.sh

  screenshot-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Roborazzi Screenshot Verification
        # Keep screenshot regression separate from the fast unit-test path.
        run: scripts/quality/build_inputs/run_gradle.sh verifyRoborazziDebug --warning-mode fail
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roborazzi-diffs
          path: "**/build/outputs/roborazzi/**"

  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Assemble
        # Run assemble targets separately so parallel Gradle execution does not compile
        # both app flavors and benchmark in the same memory peak on GitHub runners.
        run: |
          scripts/quality/build_inputs/run_gradle.sh :app:assembleDemoDebug --warning-mode fail
          scripts/quality/build_inputs/run_gradle.sh :app:assembleProdDebug --warning-mode fail
          scripts/quality/build_inputs/run_gradle.sh :benchmark:assemble --warning-mode fail
      - name: Prepare demo APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p release-assets
          mapfile -t apks < <(find app/build/outputs/apk/demo/debug -maxdepth 1 -type f -name "*.apk" -print)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "release-assets/GasStation-${GITHUB_REF_NAME#v}-demo-debug.apk"
      - name: Upload demo APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-demo-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  release-assemble:
    runs-on: ubuntu-24.04
    needs: build-inputs
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download source-bound reproducibility receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducible-prod-release-receipt-${{ github.sha }}
          path: build/reports/build-inputs/probe
      - uses: ./.github/actions/setup-build-inputs
      - name: Release Assemble
        run: scripts/quality/build_inputs/run_gradle.sh :app:assembleProdRelease --warning-mode fail
      - name: Bind assembled prod APK to reproducibility receipt
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name "*.apk" -print)
          test "${#apks[@]}" -eq 1
          python3 scripts/quality/verify_build_inputs.py release-bind \
            --policy config/quality/build-inputs.json \
            --receipt build/reports/build-inputs/probe/reproducible-prod-release-receipt.json \
            --apk "${apks[0]}" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name "reproducible-prod-release-receipt-${GITHUB_SHA}" \
            --output build/reports/build-inputs/release-assemble-binding.json
      - name: Prepare unsigned prod APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p release-assets
          mapfile -t apks < <(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name "*.apk" -print)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "release-assets/GasStation-${GITHUB_REF_NAME#v}-prod-release-unsigned.apk"
      - name: Upload unsigned prod APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-prod-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GASSTATION_COVERAGE_EVENT: ${{ github.event_name == 'pull_request' && 'pull-request' || startsWith(github.ref, 'refs/tags/v') && 'tag' || 'main' }}
      GASSTATION_COVERAGE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Create coverage attempt envelope
        env:
          COVERAGE_SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p build/reports/coverage
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "baseRef": os.environ["GASSTATION_COVERAGE_BASE_REF"],
              "event": os.environ["GASSTATION_COVERAGE_EVENT"],
              "expectedTasks": ["coverageXmlReport", "verifyCoverageReport"],
              "policy": "config/quality/coverage-policy.json",
              "baseline": "config/quality/coverage-baseline.json",
              "schemaVersion": 1,
              "sourceCommit": os.environ["COVERAGE_SOURCE_SHA"],
          }
          Path("build/reports/coverage/coverage-attempt.json").write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify trustworthy coverage
        run: |
          scripts/quality/build_inputs/run_gradle.sh coverageXmlReport verifyCoverageReport \
            -Pgasstation.coverageSourceCommit="$GITHUB_SHA" \
            -Pgasstation.coverageEvent="$GASSTATION_COVERAGE_EVENT" \
            -Pgasstation.coverageBaseRef="$GASSTATION_COVERAGE_BASE_REF" \
            --warning-mode fail
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-evidence
          path: |
            build/reports/coverage/coverage-attempt.json
            build/reports/coverage/report-manifest.json
            build/reports/coverage/verification-summary.json
            **/build/reports/coverage/*/manifest-entry.json
            **/build/reports/coverage/*/report.xml
          if-no-files-found: error
          retention-days: 7
      - name: Download verified Codecov CLI
        run: |
          mkdir -p build/quality/build-inputs
          python3 scripts/quality/verify_build_inputs.py download-codecov \
            --policy config/quality/build-inputs.json \
            --output build/quality/build-inputs/codecovcli_linux
      - name: Upload to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          binary: build/quality/build-inputs/codecovcli_linux
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/build/reports/coverage/*/report.xml"

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build-inputs
      - name: Stage mutation Java selector
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          /bin/mkdir -p build/quality/pitest-runtime/bootstrap
          set -C
          /usr/bin/printf '%s\n' "$JAVA_HOME_21_X64" > build/quality/pitest-runtime/bootstrap/java-home.selector
      - name: Mutation (pull request)
        if: github.event_name == 'pull_request'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          exec /usr/bin/env -i GASSTATION_PITEST_BOOTSTRAP=sealed-v1 \
            JAVA_HOME="$JAVA_HOME" JAVA_HOME_17_X64="$JAVA_HOME_17_X64" JAVA_HOME_21_X64="$JAVA_HOME_21_X64" \
            PATH="$JAVA_HOME_21_X64/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            LANG=C LC_ALL=C TZ=UTC TERM=dumb CI=true \
            scripts/quality/run_pitest.sh --event pull-request --base ${{ github.event.pull_request.base.sha }} --java-home-file build/quality/pitest-runtime/bootstrap/java-home.selector
      - name: Mutation (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          exec /usr/bin/env -i GASSTATION_PITEST_BOOTSTRAP=sealed-v1 \
            JAVA_HOME="$JAVA_HOME" JAVA_HOME_17_X64="$JAVA_HOME_17_X64" JAVA_HOME_21_X64="$JAVA_HOME_21_X64" \
            PATH="$JAVA_HOME_21_X64/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            LANG=C LC_ALL=C TZ=UTC TERM=dumb CI=true \
            scripts/quality/run_pitest.sh --event main --java-home-file build/quality/pitest-runtime/bootstrap/java-home.selector
      - name: Mutation (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          exec /usr/bin/env -i GASSTATION_PITEST_BOOTSTRAP=sealed-v1 \
            JAVA_HOME="$JAVA_HOME" JAVA_HOME_17_X64="$JAVA_HOME_17_X64" JAVA_HOME_21_X64="$JAVA_HOME_21_X64" \
            PATH="$JAVA_HOME_21_X64/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            LANG=C LC_ALL=C TZ=UTC TERM=dumb CI=true \
            scripts/quality/run_pitest.sh --event tag --java-home-file build/quality/pitest-runtime/bootstrap/java-home.selector
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pitest-evidence
          path: |
            build/reports/pitest/**
            domain/*/build/reports/quality/pitest-configuration.json
            domain/*/build/reports/pitest/**
          if-no-files-found: error
          retention-days: 7

  release-publish:
    runs-on: ubuntu-24.04
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [agent-contracts, build-inputs, static-analysis, lint-tests, unit-tests, screenshot-tests, assemble, release-assemble, coverage, mutation]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*-apk
          path: release-assets
          merge-multiple: true
      - name: Download source-bound reproducibility receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reproducible-prod-release-receipt-${{ github.sha }}
          path: build/reports/build-inputs/probe
      - uses: ./.github/actions/setup-build-inputs
      - name: Validate release metadata and assets
        id: release-metadata
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test "$tag" = "v$version_name"

          shopt -s nullglob
          notes_files=(docs/release-notes/*-"$tag".md)
          test "${#notes_files[@]}" -eq 1
          apk_names=(
            "GasStation-$version-demo-debug.apk"
            "GasStation-$version-prod-release-unsigned.apk"
          )
          test -f "release-assets/${apk_names[0]}"
          test -f "release-assets/${apk_names[1]}"
          printf 'prod_apk=%s\n' "release-assets/${apk_names[1]}" >> "$GITHUB_OUTPUT"
          printf 'notes_file=%s\n' "${notes_files[0]}" >> "$GITHUB_OUTPUT"
      - name: Bind published prod APK to reproducibility receipt
        run: |
          python3 scripts/quality/verify_build_inputs.py release-bind \
            --policy config/quality/build-inputs.json \
            --receipt build/reports/build-inputs/probe/reproducible-prod-release-receipt.json \
            --apk "${{ steps.release-metadata.outputs.prod_apk }}" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name "reproducible-prod-release-receipt-${GITHUB_SHA}" \
            --output build/reports/build-inputs/release-publish-binding.json
      - name: Prepare release checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk_names=(
            "GasStation-$version-demo-debug.apk"
            "GasStation-$version-prod-release-unsigned.apk"
          )
          (
            cd release-assets
            sha256sum "${apk_names[@]}" > SHA256SUMS.txt
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.release-metadata.outputs.notes_file }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$NOTES_FILE"
            gh release upload "$tag" release-assets/*.apk release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file "$NOTES_FILE" \
              release-assets/*.apk \
              release-assets/SHA256SUMS.txt
          fi
