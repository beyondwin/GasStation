name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless + Lint
        # Default lint focuses on production sources. Test-source lint is an explicit local/full-path opt-in.
        run: ./gradlew spotlessCheck lint --continue

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit Tests
        # Regular unit-test tasks exclude Roborazzi screenshot classes; screenshot-tests owns screenshot regression.
        run: |
          ./gradlew \
            :domain:location:test \
            :core:model:test \
            :domain:station:test \
            :domain:settings:test \
            :core:database:testDebugUnitTest \
            :core:datastore:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :core:location:testDebugUnitTest \
            :core:network:test \
            :data:settings:testDebugUnitTest \
            :data:station:testDebugUnitTest \
            :feature:settings:testDebugUnitTest \
            :feature:station-list:testDebugUnitTest \
            :feature:watchlist:testDebugUnitTest \
            :app:testDemoDebugUnitTest \
            :app:testProdDebugUnitTest \
            :tools:demo-seed:test

  screenshot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Roborazzi Screenshot Verification
        # Keep screenshot regression separate from the fast unit-test path.
        run: ./gradlew verifyRoborazziDebug
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: "**/build/outputs/roborazzi/**"

  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble
        # Run assemble targets separately so parallel Gradle execution does not compile
        # both app flavors and benchmark in the same memory peak on GitHub runners.
        run: |
          ./gradlew :app:assembleDemoDebug
          ./gradlew :app:assembleProdDebug
          ./gradlew :benchmark:assemble

  release-assemble:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release Assemble
        run: ./gradlew :app:assembleProdRelease

  coverage:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [unit-tests]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kover XML Report
        run: ./gradlew koverXmlReport
      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml

  dependency-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dependency Updates Report
        # Report-only: 신선도 신호일 뿐 빌드를 깨지 않는다.
        # ben-manes versions 플러그인은 configuration-cache/parallel 비호환이라 둘 다 끈다.
        continue-on-error: true
        run: ./gradlew dependencyUpdates --no-configuration-cache --no-parallel
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-updates
          path: build/dependencyUpdates/report.txt
